<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Categoria - Controle Financeiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a class="navbar__brand" href="{{ url_for('home.home') }}">Controle Financeiro</a>
        <ul class="navbar__links">
            <li><a href="{{ url_for('categoria.listar') }}">Categorias</a></li>
            <li><a href="{{ url_for('credito.listar') }}">Créditos</a></li>
            <li><a href="{{ url_for('debito.listar') }}">Débitos</a></li>
            <li><a href="{{ url_for('emprestimo.listar') }}">Empréstimos</a></li>
            <li><a href="{{ url_for('relatorio.index') }}">Relatórios</a></li>
        </ul>
        <form method="POST" action="{{ url_for('auth.logout') }}">
            <button type="submit" class="btn btn-secondary btn-sm">Sair</button>
        </form>
    </nav>

    <div class="container">

        <h1>Nova Categoria</h1>

        {% if erro %}
            <p class="alert-error">{{ erro }}</p>
        {% endif %}

        <div class="card">
            <form method="POST" action="{{ url_for('categoria.nova') }}">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" value="{{ nome }}">
                </div>

                <div class="form-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo">
                        <option value="credito" {% if tipo == "credito" %}selected{% endif %}>Crédito</option>
                        <option value="debito" {% if tipo == "debito" %}selected{% endif %}>Débito</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </form>
        </div>

        <p><a href="{{ url_for('categoria.listar') }}">Voltar para a lista</a></p>

    </div>

</body>
</html>
