<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Crédito - Controle Financeiro</title>
</head>

<body>

    <h1>Novo Crédito</h1>

    {% if erro %}
        <p style="color: red;">{{ erro }}</p>
    {% endif %}

    {% if categorias %}
        <form method="POST" action="{{ url_for('credito.nova') }}">
            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" name="descricao" value="{{ descricao }}">
            <br>

            <label for="valor">Valor:</label>
            <input type="number" step="0.01" min="0.01" id="valor" name="valor" value="{{ valor }}">
            <br>

            <label for="data">Data:</label>
            <input type="date" id="data" name="data" value="{{ data }}">
            <br>

            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria">
                {% for cat in categorias %}
                    <option value="{{ cat.nome }}" {% if cat.nome == categoria %}selected{% endif %}>
                        {{ cat.nome }}
                    </option>
                {% endfor %}
            </select>
            <br>

            <label for="comprovante">Comprovante (opcional):</label>
            <input type="text" id="comprovante" name="comprovante">
            <br>

            <button type="submit">Cadastrar</button>
        </form>
    {% else %}
        <p>Você ainda não tem nenhuma categoria de crédito cadastrada.</p>
        <p><a href="{{ url_for('categoria.nova') }}">Cadastrar categoria primeiro</a></p>
    {% endif %}

    <p><a href="{{ url_for('credito.listar') }}">Voltar para a lista</a></p>

</body>
</html>
