<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Débitos - Controle Financeiro</title>
</head>

<body>

    <h1>Débitos</h1>

    <p><a href="{{ url_for('debito.nova') }}">Cadastrar novo débito</a></p>

    {% if transacoes %}
        <ul>
            {% for transacao in transacoes %}
                <li>
                    {{ transacao.data }} — {{ transacao.descricao }}
                    — R$ {{ transacao.valor }} — {{ transacao.categoria }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Nenhum débito cadastrado ainda.</p>
    {% endif %}

</body>
</html>
