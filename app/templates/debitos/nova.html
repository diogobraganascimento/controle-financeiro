<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Débito - Controle Financeiro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a class="navbar__brand" href="{{ url_for('home.home') }}">Controle Financeiro</a>
        <ul class="navbar__links">
            <li><a href="{{ url_for('categoria.listar') }}">Categorias</a></li>
            <li><a href="{{ url_for('credito.listar') }}">Créditos</a></li>
            <li><a href="{{ url_for('debito.listar') }}">Débitos</a></li>
            <li><a href="{{ url_for('emprestimo.listar') }}">Empréstimos</a></li>
            <li><a href="{{ url_for('relatorio.index') }}">Relatórios</a></li>
        </ul>
        <form method="POST" action="{{ url_for('auth.logout') }}">
            <button type="submit" class="btn btn-secondary btn-sm">Sair</button>
        </form>
    </nav>

    <div class="container">

        <h1>Novo Débito</h1>

        {% if erro %}
            <p class="alert-error">{{ erro }}</p>
        {% endif %}

        {% if categorias %}
            <div class="card">
                <form method="POST" action="{{ url_for('debito.nova') }}">
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <input type="text" id="descricao" name="descricao" value="{{ descricao }}">
                    </div>

                    <div class="form-group">
                        <label for="valor">Valor</label>
                        <input type="number" step="0.01" min="0.01" id="valor" name="valor" value="{{ valor }}">
                    </div>

                    <div class="form-group">
                        <label for="data">Data</label>
                        <input type="date" id="data" name="data" value="{{ data }}">
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria">
                            {% for cat in categorias %}
                                <option value="{{ cat.nome }}" {% if cat.nome == categoria %}selected{% endif %}>
                                    {{ cat.nome }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="comprovante">Comprovante (opcional)</label>
                        <input type="text" id="comprovante" name="comprovante">
                    </div>

                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </div>
        {% else %}
            <p>Você ainda não tem nenhuma categoria de débito cadastrada.</p>
            <p><a href="{{ url_for('categoria.nova') }}" class="btn btn-secondary">Cadastrar categoria primeiro</a></p>
        {% endif %}

        <p><a href="{{ url_for('debito.listar') }}">Voltar para a lista</a></p>

    </div>

</body>
</html>
